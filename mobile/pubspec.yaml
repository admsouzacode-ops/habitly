name: habitly
description: Habitly - Daily Habit Tracker
# Android applicationId / namespace: br.com.souzacode.habitly
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.8.3
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.1.0
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^2.6.1
  table_calendar: ^3.1.3
  intl: any
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1B7A4B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

flutter_native_splash:
  color: "#1B7A4B"
  image: assets/splash/splash.png
  android_12:
    color: "#1B7A4B"
    image: assets/splash/splash_android12.png
    icon_background_color: "#1B7A4B"
  ios: false
  web: false
